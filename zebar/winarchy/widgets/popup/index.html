<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winarchy popup</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main role="dialog" aria-modal="false" aria-labelledby="month-label">
      <header>
        <button id="previous-month" type="button" aria-label="Previous month">‹</button>
        <h1 id="month-label" aria-live="polite">Calendar</h1>
        <button id="next-month" type="button" aria-label="Next month">›</button>
        <button id="close-popup" type="button" aria-label="Close popup">×</button>
      </header>
      <div id="calendar-content">
        <div class="calendar-hero">
          <button id="today" type="button" aria-label="Back to today" title="Back to today">
            <span id="calendar-icon"></span><span id="hero-date"></span>
          </button>
        </div>
        <div class="calendar-year-progress">
          <span id="calendar-year"></span>
          <div id="year-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
          <span id="year-percent"></span>
        </div>
        <table role="grid" aria-labelledby="month-label">
          <thead><tr id="weekdays"></tr></thead>
          <tbody id="calendar-days"></tbody>
        </table>
      </div>
      <section class="panel" id="system-content" hidden></section>
    </main>
    <p id="popup-error" role="alert" hidden></p>
    <script type="module" src="./bootstrap.mjs"></script>
  </body>
</html>
