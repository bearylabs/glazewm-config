<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>my-bar</title>
    <style>
      :root {
        color-scheme: dark;
        --ctp-crust: #181926;
        --ctp-base: #1e1e2e;
        --ctp-surface0: #363a4f;
        --ctp-surface1: #494d64;
        --ctp-overlay0: #6e738d;
        --ctp-subtext0: #a5adcb;
        --ctp-text: #cad3f5;
        --ctp-lavender: #b7bdf8;
        --ctp-peach: #f5a97f;
        --ctp-red: #ed8796;
        --ctp-mauve: #c6a0f6;
      }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 0 8px;
        box-sizing: border-box;
        background: var(--ctp-base);
        color: var(--ctp-text);
        font: 12px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        cursor: default;
      }
      .zone { display: flex; align-items: center; min-width: 0; }
      .zone--left { flex: 1; gap: 8px; }
      .zone--center {
        position: absolute;
        left: 50%;
        top: 0;
        height: 100%;
        transform: translateX(-50%);
        justify-content: center;
        pointer-events: none;
      }
      .zone--right { justify-content: flex-end; gap: 1px; }
      .zone--right .status { width: 27px; height: 24px; }
      .split, .status {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 20px;
        border: 0;
        padding: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--ctp-subtext0);
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }
      .split { color: var(--ctp-overlay0); }
      .split:hover {
        background: var(--ctp-surface0);
        color: var(--ctp-text);
      }
      button:focus-visible { outline: 1px solid var(--ctp-lavender); outline-offset: -1px; }
      .split svg, .status svg { width: 16px; height: 16px; }
      .split svg { display: none; }
      .split[data-direction='horizontal'] .split__horizontal,
      .split[data-direction='vertical'] .split__vertical { display: block; }
      .workspaces { display: flex; align-items: center; gap: 2px; }
      .workspace {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 20px;
        padding: 0 6px;
        border-radius: 5px;
        box-sizing: border-box;
        background: transparent;
        color: var(--ctp-overlay0);
        font-variant-numeric: tabular-nums;
        line-height: 1;
        transition: background-color 120ms ease, color 120ms ease;
      }
      .workspace.is-active { color: var(--ctp-subtext0); }
      .workspace:hover { background: var(--ctp-surface0); color: var(--ctp-text); }
      .ws-v1 .workspace.is-focused {
        background: var(--ctp-surface0);
        color: var(--ctp-lavender);
        font-weight: 600;
      }
      .ws-v2 .workspace.is-focused { color: var(--ctp-text); font-weight: 600; }
      .ws-v2 .workspace.is-focused::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 1px;
        width: 10px;
        height: 2px;
        border-radius: 1px;
        background: var(--ctp-lavender);
        transform: translateX(-50%);
      }
      .ws-v3 .workspace.is-focused {
        background: var(--ctp-surface1);
        color: var(--ctp-text);
        font-weight: 600;
      }
      .modes { display: flex; align-items: center; gap: 2px; }
      .mode { display: flex; align-items: center; height: 20px; color: var(--ctp-peach); font-weight: 600; line-height: 1; }
      .clock {
        pointer-events: auto;
        border: 0;
        border-radius: 5px;
        padding: 2px 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .clock, .status { position: relative; }
      .clock[aria-expanded='true']::after,
      .status[aria-expanded='true']::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 16px;
        height: 2px;
        background: var(--ctp-lavender);
        transform: translateX(-50%);
        pointer-events: none;
      }
      .clock[aria-expanded='true']::after { width: calc(100% - 12px); }
      .status[hidden] { display: none; }
      .status.is-muted { color: var(--ctp-overlay0); }
      #globalprotect-trigger .vpn__slash { display: none; }
      #globalprotect-trigger.is-muted .vpn__slash { display: block; }
      .status .vol__muted, .status.is-muted .vol__on { display: none; }
      .status.is-muted .vol__muted { display: block; }
      .status--network svg { display: none; }
      .status--network[data-link='wifi'] .net__wifi,
      .status--network[data-link='ethernet'] .net__ethernet,
      .status--network[data-link='none'] .net__none { display: block; }
      .status--network.is-vpn { color: var(--ctp-mauve); }
      .status--network[data-link='none'] { color: var(--ctp-red); }
      .status--power { color: var(--ctp-subtext0); }
      .status--power[data-state='critical'] { color: var(--ctp-red); }
      .status--power .battery__bolt, .status--power .battery__unknown { display: none; }
      .status--power[data-state='ac'] .battery__bolt { display: block; }
      .status--power[data-state='unknown'] .battery__unknown { display: block; }
      .status--power[data-state='ac'] .battery__shell,
      .status--power[data-state='ac'] .battery__fill,
      .status--power[data-state='unknown'] .battery__shell,
      .status--power[data-state='unknown'] .battery__fill { display: none; }
      .popup-error {
        position: absolute;
        right: 8px;
        max-width: 45%;
        padding: 2px 6px;
        background: var(--ctp-base);
        color: var(--ctp-red);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }
      .popup-error[hidden] { display: none; }
    </style>
  </head>
  <body class="ws-v1">
    <div class="zone zone--left">
      <button class="split" id="split" type="button" title="Tiling direction">

      </button>
      <div class="workspaces" id="workspaces"></div>
      <div class="modes" id="modes"></div>
    </div>
    <div class="zone zone--center">
      <button class="clock" id="calendar-trigger" type="button" aria-label="Open calendar"
              aria-haspopup="dialog" aria-expanded="false" data-popup-trigger="calendar">
        <span id="time">--:--</span>
      </button>
    </div>
    <div class="zone zone--right">
      <button class="status is-muted" id="globalprotect-trigger" type="button" hidden
              aria-label="Open GlobalProtect" aria-haspopup="dialog" aria-expanded="false" data-popup-trigger="globalprotect"></button>
      <button class="status" id="bluetooth-trigger" type="button"
              aria-label="Open Bluetooth devices" aria-haspopup="dialog" aria-expanded="false" data-popup-trigger="bluetooth"></button>
      <button class="status status--network" id="network-trigger" type="button"
              aria-label="Open network information" aria-haspopup="dialog" aria-expanded="false"
              data-popup-trigger="network" data-link="none">

      </button>
      <button class="status" id="audio-trigger" type="button"
              aria-label="Open audio controls" aria-haspopup="dialog" aria-expanded="false" data-popup-trigger="audio">

      </button>
      <button class="status" id="display-trigger" type="button"
              aria-label="Open display information" aria-haspopup="dialog" aria-expanded="false" data-popup-trigger="display">

      </button>
      <button class="status status--power" id="power-trigger" type="button"
              aria-label="Open power and system information" aria-haspopup="dialog" aria-expanded="false" data-popup-trigger="power" data-state="unknown">

      </button>
    </div>
    <button class="popup-error" id="popup-error" type="button" role="alert" hidden></button>
    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.3.1';
      import { networkConnection } from '../shared/network-model.mjs';
      import { batteryIndicator, powerStatusArgs } from '../shared/battery-model.mjs';
      import { createIcon, createBatteryIcon } from '../shared/icons.mjs';
      import { startNetworkBackground } from '../shared/network-background.mjs';
      import { createBarZOrder } from '../shared/bar-z-order.mjs';
      import { readSnapshot, vpnSnapshotValid } from '../shared/snapshot-cache.mjs';

      for (const [id, icons] of Object.entries({
        split: [['split-horizontal', 'split__horizontal'], ['split-vertical', 'split__vertical']],
        'network-trigger': [['wifi', 'net__wifi'], ['ethernet', 'net__ethernet'], ['wifi-off', 'net__none']],
        'bluetooth-trigger': [['bluetooth', '']],
        'globalprotect-trigger': [['globalprotect', '']],
        'audio-trigger': [['volume-high', 'vol__on'], ['volume-off', 'vol__muted']],
        'display-trigger': [['monitor', '']],
      })) {
        document.getElementById(id).replaceChildren(...icons.map(([name, className]) => createIcon(name, className)));
      }
      const vpnIcon = document.querySelector('#globalprotect-trigger svg');
      const vpnSlash = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      vpnSlash.setAttribute('class', 'vpn__slash');
      vpnSlash.setAttribute('d', 'M3 3 21 21');
      vpnSlash.setAttribute('fill', 'none');
      vpnSlash.setAttribute('stroke', 'currentColor');
      vpnSlash.setAttribute('stroke-width', '2');
      vpnSlash.setAttribute('stroke-linecap', 'round');
      // A background-colored outline keeps the slash distinct from the shield.
      const vpnSlashOutline = vpnSlash.cloneNode(true);
      vpnSlashOutline.setAttribute('stroke', 'var(--ctp-base)');
      vpnSlashOutline.setAttribute('stroke-width', '4');
      vpnIcon.append(vpnSlashOutline, vpnSlash);
      document.getElementById('power-trigger').replaceChildren(createBatteryIcon());

      // Reassigning title, even to the same value, dismisses WebView2 tooltips.
      // Provider output arrives every second; only publish actual changes.
      function setTitle(element, title) {
        if (element.title !== title) element.title = title;
      }
      const popupErrorEl = document.getElementById('popup-error');
      function reportPopupError(error) {
        console.error('Bar:', error);
        popupErrorEl.textContent = error.message ?? String(error);
        setTitle(popupErrorEl, `${popupErrorEl.textContent} (click to dismiss)`);
        popupErrorEl.hidden = false;
      }
      popupErrorEl.addEventListener('click', () => { popupErrorEl.hidden = true; });
      const updateBarZOrder = createBarZOrder(
        order => zebar.currentWidget().setZOrder(order), reportPopupError,
      );
      import('../shared/popup-controller.mjs').then(({ attachPopupTriggers }) => {
        attachPopupTriggers(
          [...document.querySelectorAll('[data-popup-trigger]')].map(trigger => ({
            trigger, type: trigger.dataset.popupTrigger,
          })),
          reportPopupError,
          () => { popupErrorEl.hidden = true; },
        );
      }).catch(reportPopupError);

      const providers = zebar.createProviderGroup({
        date: { type: 'date', refreshInterval: 1000, formatting: 'HH:mm' },
        glazewm: { type: 'glazewm' },
        network: { type: 'network', refreshInterval: 30000 },
        audio: { type: 'audio' },
      });
      const vpnEl = document.getElementById('globalprotect-trigger');
      const vpnCacheKey = 'my-bar.network.vpn.v1';
      function renderVpn(vpn) {
        vpnEl.hidden = vpn?.available !== true;
        vpnEl.classList.toggle('is-muted', vpn?.connected !== true);
        const label = `GlobalProtect -- ${vpn?.connected ? 'Connected' : 'Disconnected'}. Open VPN controls`;
        vpnEl.setAttribute('aria-label', label);
        setTitle(vpnEl, label);
      }
      renderVpn(readSnapshot(vpnCacheKey, vpnSnapshotValid));
      window.addEventListener('storage', event => {
        if (event.key === vpnCacheKey) {
          const vpn = readSnapshot(vpnCacheKey, vpnSnapshotValid);
          // An action clears the display cache while awaiting adapter confirmation.
          if (vpn) renderVpn(vpn);
        }
      });
      const stopNetworkBackground = startNetworkBackground(zebar.shellExec, () => providers.outputMap.network, { onVpn: renderVpn });
      window.addEventListener('pagehide', stopNetworkBackground, { once: true });
      const timeEl = document.getElementById('time');
      const workspacesEl = document.getElementById('workspaces');
      const modesEl = document.getElementById('modes');
      const splitEl = document.getElementById('split');
      const audioEl = document.getElementById('audio-trigger');
      const networkEl = document.getElementById('network-trigger');
      const powerEl = document.getElementById('power-trigger');
      let powerBusy = false;
      async function refreshPower() {
        if (powerBusy) return;
        powerBusy = true;
        let status;
        let failure;
        try {
          const result = await zebar.shellExec('powershell.exe', [...powerStatusArgs]);
          if (result.code !== 0) throw new Error(result.stderr || 'Power status query failed.');
          status = JSON.parse(result.stdout.replace(/^\uFEFF/, '').trim());
        } catch (error) {
          failure = error.message ?? String(error);
          console.error('Power status:', error);
        } finally {
          const indicator = batteryIndicator(status);
          powerEl.dataset.state = indicator.state;
          const fillHeight = 14 * (indicator.charge ?? 0) / 100;
          const fill = powerEl.querySelector('.battery__fill');
          fill.setAttribute('height', String(fillHeight));
          fill.setAttribute('y', String(20 - fillHeight));
          powerEl.setAttribute('aria-label', `${indicator.label}${failure ? ` — ${failure}` : ''}. Open power and system information`);
          powerBusy = false;
        }
      }
      void refreshPower();
      const powerTimer = setInterval(refreshPower, 10000);
      window.addEventListener('pagehide', () => clearInterval(powerTimer), { once: true });
      const weekday = new Intl.DateTimeFormat(navigator.language, { weekday: 'long' });
      let glazewm = null;
      providers.onError(errors => {
        for (const [name, error] of Object.entries(errors)) {
          if (error) reportPopupError(new Error(`${name}: ${error.message ?? error}`));
        }
        renderVolume(providers.outputMap.audio);
        renderNetwork(providers.outputMap.network);
      });
      providers.onOutput(output => {
        if (output.date) {
          const time = `${weekday.format(new Date(output.date.now))} ${output.date.formatted}`;
          if (timeEl.textContent !== time) timeEl.textContent = time;
        }
        renderVolume(output.audio);
        renderNetwork(output.network);
        glazewm = output.glazewm;
        updateBarZOrder(glazewm);
        renderWorkspaces(glazewm);
        renderModes(glazewm);
        renderSplit(glazewm);
      });

      function renderVolume(audio) {
        const device = audio?.defaultPlaybackDevice;
        audioEl.classList.toggle('is-muted', device?.isMuted === true);
        audioEl.setAttribute('aria-label', device
          ? `Audio -- ${device.name}, ${Number.isFinite(device.volume) ? Math.round(device.volume) + '%' : 'volume unavailable'}${device.isMuted ? ', muted' : ''}`
          : 'Audio -- no output device data');
      }
      function renderNetwork(net) {
        const { tunnel, iface, link } = networkConnection(net);
        networkEl.dataset.link = link;
        networkEl.classList.toggle('is-vpn', Boolean(tunnel));
        networkEl.setAttribute('aria-label', !net ? 'Network -- data unavailable' : [
          link === 'none' ? 'No physical link' : link === 'wifi' ? 'Wi-Fi' : 'Ethernet',
          iface?.friendlyName ?? iface?.name,
          tunnel ? 'VPN (default-route heuristic)' : null,
        ].filter(Boolean).join(' -- '));
      }
      function renderWorkspaces(wm) {
        if (!wm) return;
        workspacesEl.replaceChildren(...wm.currentWorkspaces.map(workspace => {
          const el = document.createElement('div');
          el.className = 'workspace';
          el.classList.toggle('is-focused', workspace.hasFocus);
          el.classList.toggle('is-active', !workspace.hasFocus && workspace.children.length > 0);
          el.dataset.name = workspace.name;
          el.textContent = workspace.displayName ?? workspace.name;
          return el;
        }));
      }
      function renderSplit(wm) {
        if (!wm) return;
        splitEl.dataset.direction = wm.tilingDirection ?? '';
        setTitle(splitEl, `Next split: ${wm.tilingDirection ?? 'unknown'}`);
      }
      splitEl.addEventListener('click', () => {
        glazewm?.runCommand('toggle-tiling-direction');
      });
      function renderModes(wm) {
        if (!wm) return;
        const labels = wm.bindingModes.map(mode => mode.displayName ?? mode.name);
        if (wm.isPaused) labels.unshift('pause');
        modesEl.replaceChildren(...labels.map(label => {
          const el = document.createElement('div');
          el.className = 'mode';
          el.textContent = label;
          return el;
        }));
      }
      workspacesEl.addEventListener('click', event => {
        const name = event.target.closest('.workspace')?.dataset.name;
        if (name && glazewm) glazewm.runCommand(`focus --workspace ${name}`);
      });
    </script>
  </body>
</html>
