<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System popup</title>
    <style>
      :root {
        color-scheme: dark;
        --crust: #181926;
        --base: #24273a;
        --mantle: #1e2030;
        --surface: #363a4f;
        --surface-1: #494d64;
        --overlay: #6e738d;
        --muted: #a5adcb;
        --text: #cad3f5;
        --accent: #b7bdf8;
        --blue: #8aadf4;
        --green: #a6da95;
        --yellow: #eed49f;
        --red: #ed8796;
        font: 13px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: transparent;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        padding: 1px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
      }
      html[data-popup-ready='true'] body {
        background: var(--base);
        border-color: var(--surface-1);
        opacity: 1;
        pointer-events: auto;
      }
      button { color: inherit; font: inherit; cursor: pointer; border: 0; }
      button:hover { background: var(--surface); }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      button:disabled { cursor: default; opacity: 0.45; }
      main { display: flex; flex-direction: column; width: 100%; min-height: 0; }
      header {
        flex: 0 0 auto;
        height: 48px;
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) 32px 32px;
        align-items: center;
        gap: 3px;
        padding: 7px 9px 5px;
      }
      header button { background: transparent; width: 32px; height: 32px; border-radius: 7px; font-size: 16px; }
      h1 { grid-column: 2; margin: 0; font-size: 14px; text-align: left; font-weight: 650; letter-spacing: 0.01em; }
      #previous-month { grid-column: 1; grid-row: 1; }
      #next-month { grid-column: 3; grid-row: 1; }
      #close-popup { grid-column: 4; grid-row: 1; color: var(--muted); font-size: 20px; line-height: 1; }
      #calendar-content { flex: 0 0 auto; min-height: 0; max-height: calc(var(--popup-max-height, 100vh) - 52px); padding: 0 13px 12px; overflow: auto; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      th { height: 26px; color: var(--muted); font-size: 10px; font-weight: 650; text-transform: uppercase; }
      td { padding: 1px; text-align: center; }
      td button { width: 100%; height: 36px; border-radius: 7px; background: transparent; }
      td button[data-outside='true'] { color: var(--overlay); }
      td button[aria-current='date'] { box-shadow: inset 0 0 0 1px var(--accent); }
      td[aria-selected='true'] button { background: var(--surface); color: var(--accent); }
      footer { margin-top: 7px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #selected-date { color: var(--muted); font-size: 11px; }
      #today { border-radius: 7px; background: var(--surface); padding: 6px 10px; }
      #popup-error {
        position: absolute;
        z-index: 10;
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-height: 72px;
        margin: 0;
        padding: 9px 11px;
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--red) 55%, transparent);
        border-radius: 7px;
        background: var(--mantle);
        color: var(--red);
        box-shadow: 0 8px 24px #0008;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      [hidden] { display: none !important; }
      .panel {
        flex: 0 0 auto;
        min-height: 0;
        max-height: calc(var(--popup-max-height, 100vh) - 52px);
        overflow-x: hidden;
        overflow-y: auto;
        padding: 2px 12px 12px;
        scrollbar-width: thin;
        scrollbar-color: var(--surface-1) transparent;
      }
      .panel::-webkit-scrollbar { width: 6px; }
      .panel::-webkit-scrollbar-thumb { background: var(--surface-1); border-radius: 9px; }
      .panel h2 {
        margin: 15px 2px 7px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .panel h2:first-child { margin-top: 2px; }
      .panel p { margin: 7px 0; overflow-wrap: anywhere; }
      .panel dl { margin: 0; }
      .panel dt { color: var(--muted); font-size: 11px; }
      .panel dd { margin: 2px 0 0; overflow-wrap: anywhere; white-space: pre-line; }
      .panel > dl, .card {
        padding: 11px 12px;
        border: 1px solid color-mix(in srgb, var(--surface-1) 70%, transparent);
        border-radius: 9px;
        background: color-mix(in srgb, var(--surface) 54%, transparent);
      }
      .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
      .details-grid > div { min-width: 0; }
      .details-grid .wide { grid-column: 1 / -1; }
      .hero { display: flex; align-items: center; gap: 13px; min-height: 58px; padding: 7px 3px 12px; }
      .hero__icon {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--surface);
        color: var(--accent);
        font-size: 21px;
      }
      .hero__icon svg { width: 24px; height: 24px; }
      .hero__body { min-width: 0; flex: 1; }
      .hero__title { margin: 0; overflow: hidden; color: var(--text); font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .hero__meta { margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
      .hero__value { flex: 0 0 auto; font-size: 25px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 99px; background: var(--surface); color: var(--muted); font-size: 10px; font-weight: 650; }
      .badge--ok { color: var(--green); }
      .badge--accent { color: var(--accent); }
      .meter { height: 6px; overflow: hidden; border-radius: 99px; background: var(--surface-1); }
      .meter > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
      .panel button { padding: 7px 10px; border-radius: 7px; background: var(--surface); }
      .panel input[type='range'] { width: 100%; accent-color: var(--accent); }
      .panel .note { color: var(--muted); font-size: 10px; line-height: 1.45; }
      .panel .error { color: var(--red); }
      .panel .controls { position: sticky; z-index: 2; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 13px -2px -2px; padding: 9px 2px 2px; background: linear-gradient(transparent, var(--base) 28%); }
      .panel .controls button { min-width: 0; padding: 9px 5px; }
      .panel .controls button:last-child { color: var(--red); }
      #power-confirmation { position: sticky; z-index: 3; bottom: 3px; padding: 11px; margin-top: 10px; border: 1px solid var(--red); border-radius: 8px; background: var(--mantle); box-shadow: 0 8px 24px #0008; }
      #power-confirmation p { margin-top: 0; }
      #power-confirmation button { margin-right: 7px; }
      .panel .display-refresh { flex: 0 0 auto; padding: 6px 8px; font-size: 10px; border: 1px solid color-mix(in srgb, var(--text) 40%, transparent); border-radius: 0; background: color-mix(in srgb, var(--text) 4%, transparent); }
      .panel .display-refresh:hover, .panel .display-refresh:focus-visible { border-color: color-mix(in srgb, var(--text) 25%, transparent); background: color-mix(in srgb, var(--text) 8%, transparent); outline: none; }
      .display-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); }
      .display-section__heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
      .panel .display-section h2 { margin: 0; color: var(--panel-caption); font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .display-section__meta { min-width: 0; overflow: hidden; color: var(--panel-caption); font-size: 10px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .display-scale__value { display: inline-block; padding: 6px 10px; background: color-mix(in srgb, var(--text) 18%, transparent); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .display-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .display-row { min-width: 0; }
      .display-row__heading { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 5px 6px; }
      .display-row--current .display-row__heading { background: color-mix(in srgb, var(--text) 18%, transparent); }
      .display-row__icon { display: grid; place-items: center; flex: 0 0 22px; width: 22px; }
      .display-row__icon svg { width: 16px; height: 16px; }
      .display-row h3 { flex: 1; min-width: 0; margin: 0; font-size: 12px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .display-row--current h3 { font-weight: 700; }
      .display-row__state { flex: 0 0 auto; font-size: 10px; }
      .display-details { display: grid; gap: 4px; padding: 6px 6px 0 36px; }
      .display-details > div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: baseline; }
      .panel .display-details dt { color: var(--panel-caption); font-size: 11px; }
      .panel .display-details dd { min-width: 0; margin: 0; font-size: 12px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
      .panel .display-note { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); color: var(--panel-caption); }
      .power-hero .hero__value { font-size: 28px; font-weight: 700; }
      .power-stats > .battery-progress { height: 8px; margin: 14px 0; }
      html[data-popup-type='power'] .meter { height: 4px; background: color-mix(in srgb, var(--text) 12%, transparent); }
      html[data-popup-type='power'] .meter > span { background: var(--text); }
      html[data-popup-type='power'] .battery-progress { height: 8px; }
      .battery-progress[data-charging='true'] > span { animation: battery-charge-pulse 1900ms ease-in-out infinite; }
      @keyframes battery-charge-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      .power-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); }
      .panel .power-section h2 { margin: 0 0 10px; color: var(--panel-caption); font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .power-details { display: grid; gap: 4px; }
      .power-details > div { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 14px; align-items: baseline; }
      .panel .power-details dt { color: var(--panel-caption); font-size: 11px; }
      .panel .power-details dd { min-width: 0; margin: 0; font-size: 11px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
      .battery-details { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      .battery-details > div { grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
      .battery-details dd { text-align: right; }
      .power-drive { margin-top: 10px; }
      .power-drive__heading { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
      .power-drive__heading strong { min-width: 0; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .power-drive__heading span { flex: 0 0 auto; color: var(--panel-caption); font-size: 10px; }
      .panel .power-drive .note { margin: 4px 0 0; color: var(--panel-caption); }
      .panel .power-actions { position: sticky; z-index: 2; bottom: 0; padding-bottom: 0; background: var(--base); }
      .panel .power-actions .controls { position: static; margin: 0; padding: 0; gap: 6px; background: transparent; }
      .power-actions .controls button, html[data-popup-type='power'] #power-confirmation button { padding: 8px 6px; border: 1px solid color-mix(in srgb, var(--text) 40%, transparent); border-radius: 0; background: color-mix(in srgb, var(--text) 4%, transparent); font-size: 11px; }
      .power-actions .controls button:hover, .power-actions .controls button:focus-visible,
      html[data-popup-type='power'] #power-confirmation button:hover,
      html[data-popup-type='power'] #power-confirmation button:focus-visible { border-color: color-mix(in srgb, var(--text) 25%, transparent); background: color-mix(in srgb, var(--text) 8%, transparent); outline: none; }
      html[data-popup-type='power'] #power-confirmation { border-radius: 0; background: var(--base); box-shadow: none; }
      /* Omarchy: flat surfaces, foreground-colored controls, 14px panel rhythm.
         Keep the existing Macchiato palette for all system panels. */
      html:is([data-popup-type='audio'], [data-popup-type='network'], [data-popup-type='display'], [data-popup-type='power']) body {
        border-width: 2px;
        border-radius: 0;
        font: 12px "JetBrainsMono Nerd Font", "JetBrains Mono", Consolas, monospace;
        --audio-selected: color-mix(in srgb, var(--text) 18%, transparent);
        --audio-hover: color-mix(in srgb, var(--text) 8%, transparent);
        --audio-outline: color-mix(in srgb, var(--text) 25%, transparent);
        --panel-caption: color-mix(in srgb, var(--text) 71.4%, black);
        --audio-caption: var(--panel-caption);
      }
      html:is([data-popup-type='audio'], [data-popup-type='network'], [data-popup-type='display'], [data-popup-type='power'])[data-popup-ready='true'] body { border-color: var(--accent); }
      html:is([data-popup-type='audio'], [data-popup-type='network'], [data-popup-type='display'], [data-popup-type='power']) .panel {
        max-height: calc(var(--popup-max-height, 100vh) - 6px);
        padding: 14px;
      }
      :is(.audio-hero, .network-hero, .display-hero, .power-hero).hero { min-height: 34px; gap: 14px; padding: 0; margin-bottom: 14px; }
      :is(.audio-hero, .network-hero, .display-hero, .power-hero) .hero__icon { flex-basis: 24px; width: 24px; height: 24px; border-radius: 0; background: transparent; color: var(--text); }
      :is(.audio-hero, .network-hero, .display-hero, .power-hero) .hero__title { margin: 0; font-size: 14px; font-weight: 700; }
      :is(.audio-hero, .network-hero, .display-hero, .power-hero) .hero__meta { margin-top: 2px; color: var(--panel-caption); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .network-hero.hero { margin-bottom: 12px; }
      .network-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); }
      .network-section__heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      .panel .network-section h2 { margin: 0; color: var(--panel-caption); font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .network-section__state { color: var(--text); font-size: 10px; font-weight: 700; white-space: nowrap; }
      .network-details { display: grid; gap: 4px; }
      .network-details > div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: baseline; }
      .panel .network-details dt { color: var(--panel-caption); font-size: 11px; }
      .panel .network-details dd { min-width: 0; margin: 0; color: var(--text); font-size: 12px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
      .panel .network-note { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--text) 18%, transparent); color: var(--panel-caption); }
      .panel .network-direct { margin: 12px 0 0; color: var(--panel-caption); }
      .panel .audio-switch { display: grid; place-items: center; flex: 0 0 54px; width: 54px; height: 34px; padding: 6px; background: transparent; border: 1px solid transparent; border-radius: 0; }
      .panel .audio-switch:hover, .panel .audio-switch:focus-visible { border-color: var(--audio-outline); background: transparent; outline: none; }
      .audio-switch__track { display: block; position: relative; width: 42px; height: 22px; border: 1px solid color-mix(in srgb, var(--text) 40%, transparent); background: color-mix(in srgb, var(--text) 4%, transparent); }
      .audio-switch__knob { position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: var(--audio-caption); transition: transform 120ms ease, background 120ms ease; }
      .audio-switch[aria-checked='true'] .audio-switch__track { border-color: transparent; background: var(--audio-selected); }
      .audio-switch[aria-checked='true'] .audio-switch__knob { transform: translateX(20px); background: var(--text); }
      .audio-separator { height: 1px; margin-bottom: 14px; background: color-mix(in srgb, var(--text) 18%, transparent); }
      .audio-control__row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; color: var(--audio-caption); font-size: 10px; font-weight: 700; }
      .audio-control__row label { letter-spacing: 1px; }
      .audio-control__row output { padding-right: 6px; font-variant-numeric: tabular-nums; }
      .audio-slider-row { height: 30px; display: flex; align-items: center; padding: 0 6px; margin-bottom: 6px; border: 1px solid transparent; }
      .audio-slider-row:hover, .audio-slider-row:focus-within { background: var(--audio-hover); border-color: var(--audio-outline); }
      .panel .audio-slider-row input[type='range'] { appearance: none; -webkit-appearance: none; height: 22px; margin: 0; background: transparent; cursor: pointer; outline: none; }
      .audio-slider-row input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--text) var(--audio-progress, 0%), var(--audio-selected) var(--audio-progress, 0%)); }
      .audio-slider-row input::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border: 2px solid var(--base); border-radius: 50%; background: var(--text); transition: transform 110ms ease; }
      .audio-slider-row input:hover::-webkit-slider-thumb { transform: scale(1.15); }
      .audio-slider-row input::-moz-range-track { height: 4px; border-radius: 2px; background: var(--audio-selected); }
      .audio-slider-row input::-moz-range-progress { height: 4px; background: var(--text); }
      .audio-slider-row input::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid var(--base); border-radius: 50%; background: var(--text); }
      .audio-devices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
      .panel .audio-device { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 5px 6px; text-align: left; border: 1px solid transparent; border-radius: 0; background: transparent; }
      .panel .audio-device[aria-pressed='true'] { background: var(--audio-selected); font-weight: 700; }
      .panel .audio-device:hover, .panel .audio-device:focus-visible { background: var(--audio-hover); border-color: var(--audio-outline); outline: none; }
      .audio-device__icon { flex: 0 0 22px; width: 22px; display: grid; place-items: center; color: var(--text); }
      .audio-device__icon svg { width: 16px; height: 16px; }
      .audio-device__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      [data-muted='true'] .audio-hero .hero__icon,
      [data-muted='true'] .audio-control__row output,
      [data-muted='true'] #volume-slider { opacity: 0.5; }
      .panel .audio-status { margin: 6px 0 0; }
      @media (prefers-reduced-motion: reduce) {
        .audio-switch__knob, .audio-slider-row input::-webkit-slider-thumb { transition: none; }
        .battery-progress[data-charging='true'] > span { animation: none; }
      }
    </style>
  </head>
  <body>
    <main role="dialog" aria-modal="false" aria-labelledby="month-label">
      <header>
        <button id="previous-month" type="button" aria-label="Previous month">‹</button>
        <h1 id="month-label" aria-live="polite">Calendar</h1>
        <button id="next-month" type="button" aria-label="Next month">›</button>
        <button id="close-popup" type="button" aria-label="Close popup">×</button>
      </header>
      <div id="calendar-content">
        <table role="grid" aria-labelledby="month-label">
          <thead><tr id="weekdays"></tr></thead>
          <tbody id="calendar-days"></tbody>
        </table>
        <footer>
          <span id="selected-date"></span>
          <button id="today" type="button">Today</button>
        </footer>
      </div>
      <section class="panel" id="system-content" hidden></section>
    </main>
    <p id="popup-error" role="alert" hidden></p>
    <script type="module">
      function reportError(error) {
        console.error('System popup:', error);
        const element = document.getElementById('popup-error');
        element.textContent = error.message ?? String(error);
        element.hidden = false;
        // Startup failures must still be visible, even before the first resize.
        document.documentElement.setAttribute('data-popup-ready', 'true');
      }
      Promise.all([
        import('../shared/popup-controller.mjs'),
        import('./calendar.mjs'),
        import('./system.mjs'),
      ]).then(([{ initialisePopup }, { renderCalendar }, { renderSystemPopup }]) =>
        initialisePopup(type => {
          const calendar = type === 'calendar';
          document.getElementById('calendar-content').hidden = !calendar;
          document.getElementById('system-content').hidden = calendar;
          document.getElementById('previous-month').hidden = !calendar;
          document.getElementById('next-month').hidden = !calendar;
          return calendar ? renderCalendar() : renderSystemPopup(type, reportError);
        }, reportError),
      ).catch(reportError);
    </script>
  </body>
</html>
